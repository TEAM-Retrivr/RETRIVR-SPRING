server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: ${FLYWAY_ENABLE}
    locations: ${FLYWAY_LOCATION}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${FLYWAY_BASELINE_VERSION}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true

app:
  base-url: ${SERVER_BASE_URL}
  alim-talk:
    host: ${ALIM_TALK_HOST}
    user-id: ${ALIM_TALK_USER_ID}
    profile-key: ${ALIM_TALK_PROFILE_KEY}
  email-verification:
    expires-seconds: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:600}
    resend-block-seconds: ${EMAIL_VERIFICATION_RESEND_BLOCK_SECONDS:60}
    max-failed-attempts: ${EMAIL_VERIFICATION_MAX_FAILED_ATTEMPTS:5}

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expire-time: ${JWT_ACCESS_EXPIRE_MS:1800000}
  refresh-token:
    expire-time: ${JWT_REFRESH_EXPIRE_MS:259200000}

auth:
  refresh-token:
    cookie-secure: ${AUTH_REFRESH_TOKEN_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_REFRESH_TOKEN_COOKIE_SAME_SITE:None}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: ${CORS_ALLOWED_METHODS}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
      put-expiration: ${S3_PUT_EXPIRATION:300000}  #ms (5분)
      get-expiration: ${S3_GET_EXPIRATION:300000}  #ms (5분)

scheduler:
  missing-billing-schedule:
    delay: ${MISSING_BILLING_SCHEDULE_DELAY:60000}
    batch-size: ${MISSING_BILLING_SCHEDULE_BATCH_SIZE:50}
  pending-payment-recovery:
    delay: ${PENDING_PAYMENT_RECOVERY_DELAY:60000}
    batch-size: ${PENDING_PAYMENT_RECOVERY_BATCH_SIZE:50}
    retry-age-seconds: ${PENDING_PAYMENT_RECOVERY_RETRY_AGE_SECONDS:60}
  billing-schedule-retry:
    delay: ${BILLING_SCHEDULE_RETRY_DELAY:30000}
    batch-size: ${BILLING_SCHEDULE_RETRY_BATCH_SIZE:50}
    retry-age-seconds: ${BILLING_SCHEDULE_RETRY_AGE_SECONDS:30}
  payment-compensation:
    delay: ${PAYMENT_COMPENSATION_DELAY:30000}
    batch-size: ${PAYMENT_COMPENSATION_BATCH_SIZE:50}
    retry-age-seconds: ${PAYMENT_COMPENSATION_RETRY_AGE_SECONDS:30}
  payment-reconciliation:
    delay: ${PAYMENT_RECONCILIATION_DELAY:30000}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}
    retry-age-seconds: ${PAYMENT_RECONCILIATION_RETRY_AGE_SECONDS:30}
  rental-expire:
    delay: ${RENTAL_EXPIRE_DELAY:60000}
    batch-size: ${RENTAL_EXPIRE_BATCH_SIZE:100}
    max-iterations: ${RENTAL_EXPIRE_MAX_ITERATIONS:100}
    request-expire-minutes: ${RENTAL_EXPIRE_REQUEST_EXPIRE_MINUTES:15}

public-id:
  secret: ${PUBLIC_ID_SECRET}

manager-secret: ${MANAGER_SECRET}

portone:
  v2:
    store-id: ${PORTONE_STORE_ID}
    kakao-pay-properties:
      channel-key: ${KAKAOPAY_CHANNEL_KEY}
    toss-pay-properties:
      channel-key: ${TOSSPAY_CHANNEL_KEY}
    kg-inicis-properties:
      channel-key: ${KGINICIS_CHANNEL_KEY}
    api-secret: ${PORTONE_API_SECRET}
    base-url: ${PORTONE_BASE_URL:https://api.portone.io}
